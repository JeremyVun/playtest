description: Rotate a secret and verify the ring it belongs to points where it should.
story: |
  Staging credentials were rotated this morning and someone has to
  update them wherever this tool keeps them, or tonight's checks will
  fail. Find where the staging deployment of the todo app is configured,
  put the new secret value in (any value will do), and satisfy yourself
  the checks will use it — and that nobody can read the old or new value
  back out.
persona: [setup-dev]
report:
  - How did they reach the application and its staging ring? Was Applications where they looked first, and did anything feel hidden or, worse, missing?
  - Did the write-only secret behavior read as a security feature or as a bug? Quote the copy that carried that.
  - Could they connect the ring to "what runs will actually use" — its URL, its sign-in identities, its logical overlay — or did that stay abstract?
  - Any moment where they weren't sure the save took effect, or feared they'd broken tonight's run?
