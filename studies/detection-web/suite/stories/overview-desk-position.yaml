description: Read the morning desk position off the desk overview.
story: |
  You are the supervisor opening the lending desk for the day. Before anyone
  turns up you want the whole position on one screen: how much kit is with
  borrowers, what is late and by how much, what is expected back before the
  cut-off today, and what is still waiting on your decision. Stay on the desk's
  front page and read all of it off.
success:
  - console_errors: 0
  - url_matches: "/"
  - label: Counter tiles
    assert: >-
      The page is headed `Desk overview` with the subtitle
      `Desk day Mon 16 Mar 2026`, the footer reads
      `Desk time Mon 16 Mar 2026, 09:00`, and the seven counter tiles read:
      Out on loan 3 (`Currently with borrowers`), Overdue 1
      (`Past the 17:00 due time`), Due back today 1
      (`Expected at the desk by 17:00`), Awaiting approval 2
      (`Needs a supervisor decision`), Ready for pickup 1
      (`Approved and waiting on the shelf`), Units available 40
      (`of 53 units in the catalogue`), and Charges booked today $341.00
      (`New loans and late fees`).
  - label: Overdue and due-back lists
    assert: >-
      The Overdue loans list holds exactly one row — loan L-1042 for
      Marcus Webb, due Wed 11 Mar 2026, 3 business days late, late fee today
      $45.00 — and the Due back today list holds exactly one row, loan L-1041
      for Priya Raman, due Mon 16 Mar 2026, 17:00.
  - label: Pickup and approval lists
    assert: >-
      The Ready for pickup list holds only loan L-1043 for Dana Okoye with
      pickup Tue 17 Mar 2026, and the Awaiting approval list holds exactly two
      rows: loan L-1044 for Theo Lindqvist with total due $341.00 and loan
      L-1045 for Aisha Farouk with total due $1,131.00.
