# Fixture suite for the hosted MOBILE pool path (tests/mobile/pool-mobile.test.ts).
#
# It authors NO physical target — no build path, no device, no Appium endpoint.
# Those are facts only the claiming runner knows: it reads them from its own
# config file, keyed by the immutable (application key, ring key) the console
# shows, and they arrive as core's runtime target after the complete authored
# merge (docs/contracts/hosted.md, "Applications and rings").
#
# The suite commits and lists anyway because every hosted read resolves through
# core's STRUCTURAL mode, which validates cases and logical configuration
# without requiring a complete physical target
# (docs/contracts/engine.md, "Resolution modes"). The placeholder `app:` this
# file used to carry existed only to satisfy executable resolution at listing
# time; structural resolution made it unnecessary.
app:
  driver: mobile
  platform: ios
