# Discovery study over the hosted Playtest web app (ROADMAP.md M1).
#
# No database service and no container: `npm run hosted` from the repository
# root brings up the whole platform under PLAYTEST_AUTH=dev at
# http://127.0.0.1:4177, with one peer runner beside it. Then seed a THROWAWAY
# project from the study-owned todo fixture — discovery actors mutate state, so
# never point this study at real data.
#
# Story files live beside this file (one per core journey — see ROADMAP.md
# M1 step 2 for the list); personas are already authored in personas/.
mode: discovery
# GPT tiers, not Claude names: behind the codex gateway only GPT tiers route
# for real (tools/codex-gateway/README.md "Model routing"); a Claude pin would
# silently run on the gateway default while the manifest claims otherwise.
actor_model: gpt5_4_mini
grader_model: gpt5_5
app:
  base_url: http://127.0.0.1:4177
