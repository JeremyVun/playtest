description: Rotate a secret and verify the environment points where it should.
story: |
  Staging credentials were rotated this morning and someone has to
  update them wherever this tool keeps them, or tonight's checks will
  fail. Find where the staging environment is configured, put the new
  secret value in (any value will do), and satisfy yourself the checks
  will use it — and that nobody can read the old or new value back out.
persona: [setup-dev]
report:
  - How did they find settings/environments, and were the role-gated tabs legible (did anything feel hidden or, worse, missing)?
  - Did the write-only secret behavior read as a security feature or as a bug? Quote the copy that carried that.
  - Could they connect the environment to "what runs will actually use" (resolved overlay, auth identity), or did that stay abstract?
  - Any moment where they weren't sure the save took effect, or feared they'd broken tonight's run?
