description: Check the overdue camera loan back in as damaged and settle its fee.
story: |
  Marcus Webb has finally brought back the long-overdue camera package on loan
  "L-1042", and the tripod head has come back cracked. Book the whole kit back
  in at the desk this morning, recording that it returned damaged and noting
  the cracked tripod head, so the late fee and the deposit are settled on the
  loan's record.
success:
  - console_errors: 0
  - url_matches: "*/loans/L-1042"
  - label: Return record condition and time
    assert: >-
      The loan now carries a `Return record` panel showing checked in
      `Mon 16 Mar 2026, 09:00`, condition Damaged and a note about the cracked
      tripod head.
  - label: Late fee and deposit outcome
    assert: >-
      That Return record panel shows late fee $45.00 and deposit
      `$669.00 held pending inspection.`
  - label: Returned-loan charge line
    assert: >-
      The Charges panel carries the returned-loan line
      `Late fee charged on return: $45.00.`
  - label: Charges unchanged by the return
    assert: >-
      The Charges panel still reads Base charge $231.00,
      `Bundle discount (3+ units)` of −$23.10, Refundable deposit $669.00 and
      Total due at pickup $876.90.
