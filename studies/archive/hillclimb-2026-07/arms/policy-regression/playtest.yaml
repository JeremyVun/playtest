# Arm B (policy) regression suite — one story per fix, pinned by the arm's
# blind policy operator (prereg policy point 3). Runs every climb round; a
# regressed fix must turn a story's report answers bad. Environmental config
# mirrors the frozen instrument.
mode: discovery
actor_model: gpt5_4_mini
grader_model: gpt5_5
timeout: "60m"
app:
  base_url: http://127.0.0.1:4183
  init: ./reset.mjs
