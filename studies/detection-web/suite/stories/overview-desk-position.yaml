description: Read the morning desk position off the desk overview.
story: |
  You are the supervisor opening the lending desk for the day. Before anyone
  turns up you want the whole position on one screen: how much kit is with
  borrowers, what is late and by how much, what is expected back before the
  cut-off today, and what is still waiting on your decision. Stay on the desk's
  front page and read all of it off.
success:
  - console_errors: 0
  - url_matches: "/"
  - label: Page identity
    assert: >-
      The page is headed `Desk overview` with the subtitle
      `Desk day Mon 16 Mar 2026`.
  - label: Counter tile notes and money
    assert: >-
      Among the counter tiles, `Charges booked today` reads $341.00 under the
      note `New loans and late fees`, and `Units available` carries the note
      `of 53 units in the catalogue`.
  - label: Overdue list
    assert: >-
      The Overdue loans list holds exactly one row: loan L-1042 for
      Marcus Webb, items `Canon C70 Cinema Camera + 2 more (3 units)`, due
      Wed 11 Mar 2026, with a late fee today of $45.00.
  - label: Due back today list
    assert: >-
      The Due back today list holds exactly one row: loan L-1041 for
      Priya Raman, items `Sony A7 IV Mirrorless Kit + 1 more (2 units)`, due
      `Mon 16 Mar 2026, 17:00`.
  - label: Ready for pickup list
    assert: >-
      Beneath the caption `Approved loans waiting for the borrower to
      collect.`, the Ready for pickup list holds exactly one row: loan L-1043
      for Dana Okoye, items `GoPro Hero 12 Action Kit (2 units)`, pickup
      Tue 17 Mar 2026.
  - label: Awaiting approval list
    assert: >-
      Beneath the caption `Requests held until a supervisor decides.`, the
      Awaiting approval list holds exactly two rows: loan L-1044 for
      Theo Lindqvist of Music, status Awaiting approval, total due $341.00; and
      loan L-1045 for Aisha Farouk of Architecture, status Awaiting approval,
      total due $1,131.00.
