description: Withdraw the ready-for-pickup GoPro booking and return its units.
story: |
  Dana Okoye has emailed to say the inter-college relay coverage is off and she
  no longer needs the action cameras she booked on loan "L-1043". Withdraw that
  booking at the desk so the cameras go straight back into stock, and confirm
  on the loan's record that it is done.
success:
  - console_errors: 0
  - url_matches: "*/loans/L-1043"
  - label: Cancelled banner
    assert: >-
      The loan page shows the success banner
      `L-1043 cancelled. 2 units are back in stock.`
  - label: Status pill
    assert: >-
      The page is headed `Loan L-1043` with a status pill reading `Cancelled`,
      under the subtitle `Dana Okoye · Athletics · booked Fri 13 Mar 2026,
      10:05`.
  - label: Cancellation recorded on the schedule
    assert: >-
      The Schedule panel records the loan as Cancelled at
      `Mon 16 Mar 2026, 09:00`.
  - label: Schedule otherwise unchanged
    assert: >-
      The Schedule panel still shows pickup date Tue 17 Mar 2026, a loan period
      of 3 days, due back `Fri 20 Mar 2026, 17:00` and extension
      `None used (one allowed)`.
  - label: Items and charge unchanged
    assert: >-
      The Items panel is headed `Items (2 units)` and its one row is
      GoPro Hero 12 Action Kit, asset tag CAM-GP12, daily rate $6.00, with
      `Charge for 3 days` of $36.00.
